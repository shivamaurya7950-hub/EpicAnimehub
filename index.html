<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Epic Anime Hub</title>
  <meta name="description" content="Watch 46 anime posters in a mobile-friendly Netflix-style layout. Categories: Action, Romance, Fantasy, Comedy. Includes search and episode buttons.">
  <meta name="keywords" content="Anime, Epic Anime, Anime World, Netflix style anime, Naruto, One Piece, Bleach">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: #222;
      color: #fff;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    nav a {
      color: #fff;
      margin-left: 15px;
      text-decoration: none;
      font-size: 16px;
    }

    /* Search bar */
    .search-bar {
      display: flex;
      justify-content: center;
      padding: 15px;
      background-color: #f0f0f0;
    }
    .search-bar input {
      width: 80%;
      padding: 10px;
      font-size: 16px;
    }

    /* Anime grid */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 15px;
    }
    .anime-card {
      text-align: center;
      background-color: #eee;
      padding: 10px;
      border-radius: 8px;
    }
    .anime-card img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .anime-card button {
      margin-top: 8px;
      padding: 5px 10px;
      border: none;
      background-color: #222;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    .anime-card button:hover {
      background-color: #555;
    }

    /* Responsive mobile */
    @media screen and (max-width: 600px) {
      header h1 {
        font-size: 20px;
      }
      nav a {
        font-size: 14px;
      }
    }
  </style>
</head>

  <!-- Search script -->
  <script>
    const searchInput = document.getElementById('searchInput');
    const animeGrid = document.getElementById('animeGrid');
    const cards = animeGrid.getElementsByClassName('anime-card');

    searchInput.addEventListener('keyup', function() {
      const filter = searchInput.value.toLowerCase();
      for (let i = 0; i < cards.length; i++) {
        let title = cards[i].getElementsByTagName('img')[0].alt.toLowerCase();
        if (title.includes(filter)) {
          cards[i].style.display = '';
        } else {
          cards[i].style.display = 'none';
        }
      }
    });
  </script>
